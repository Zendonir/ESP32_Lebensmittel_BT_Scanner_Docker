<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1e88e5">
  <title>Vorrat</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/app.css">
  <style>
    body { padding-bottom: calc(62px + env(safe-area-inset-bottom)); }

    header.m {
      position: sticky; top: 0; z-index: 20;
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 10px 14px calc(10px);
      display: flex; gap: 10px; align-items: center;
    }
    header.m h1 { font-size: 16px; margin: 0; flex: 1; }

    /* Die Regeln in app.css haengen an <button>, greifen an einem <a> also
       nicht - der Weg zurueck in die volle Verwaltung soll aber wie ein Knopf
       aussehen und nicht wie ein Link im Fliesstext. */
    .linkbtn {
      padding: 5px 10px; border: 1px solid var(--border); border-radius: 8px;
      background: var(--surface-2); color: var(--text);
      font-size: 13px; text-decoration: none; white-space: nowrap;
    }

    .list { padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
    .kacheln { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px; }
    .kachel { text-align: left; padding: 16px 14px; min-height: 84px; border-radius: 14px;
      background: var(--surface); border: 1px solid var(--border); border-left: 6px solid var(--farbe);
      display: flex; flex-direction: column; gap: 4px; color: var(--text); font: inherit; }
    .kachel b { font-size: 16px; }
    .kachel span { font-size: 12px; color: var(--muted); }

    /* Wischen zum Auslagern: die sichtbare Karte liegt ueber dem Aktionsfeld
       und wird nach links geschoben. Ohne eigenen Stacking-Kontext scheint der
       Knopf sonst durch - genau der Fehler aus dem ersten Projekt. */
    .swipe { position: relative; overflow: hidden; border-radius: var(--radius); }
    .swipe-action {
      position: absolute; inset: 0; display: flex; justify-content: flex-end; align-items: center;
      padding-right: 20px; background: var(--danger); color: #fff; font-weight: 600;
    }
    .swipe-inner {
      position: relative; z-index: 1;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 12px 14px; transition: transform .16s ease-out; touch-action: pan-y;
    }
    .swipe-inner .t { font-weight: 600; }
    .swipe-inner .s { color: var(--muted); font-size: 13px; margin-top: 2px; }
    /* Inventar kompakt: Name und Resttage in einer Zeile, darunter der Rest.
       Die Etikettnummer steht nicht da - auf dem Etikett sieht man sie nicht,
       gebraucht wird sie nur intern (data-label) fuer Auslagern/Nachdruck. */
    .swipe-inner .kopf { display: flex; align-items: center; gap: 8px; }
    .swipe-inner .kopf .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .swipe-inner .kopf .pill { flex: none; }
    #m-list { gap: 6px; }
    /* Gruppe gleicher Produkte: Kopf wie eine Karte, aufgeklappt die
       einzelnen Packungen eingerueckt darunter. */
    .gruppe { display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px; }
    .gruppe .gkopf { cursor: pointer; }
    #tpl-list { gap: 6px; }
    #tpl-list .swipe-inner { padding: 8px 12px; }
    .tpl-zeile { width: 100%; text-align: left; font: inherit; color: inherit; }
    .tpl-zeile .s { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .gruppe .gkopf .t::before { content: '▸ '; color: var(--muted); }
    .gruppe .gkopf[aria-expanded="true"] .t::before { content: '▾ '; }
    .gruppe .pill.anzahl { background: var(--surface-2, rgba(127,127,127,.18)); }
    .gruppe .gliste { display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px; margin-left: 14px; }
    .gruppe .gliste .t { font-weight: 500; font-size: 14px; }
    .gruppe .g-ort { font-size: 12px; color: var(--muted); padding: 4px 2px 0;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .gruppe .gliste[hidden] { display: none; }
    .gruppe .gliste .swipe-inner { padding: 6px 12px; }
    /* Einlagern-Maske: muss ohne Scrollen auf einen Handybildschirm passen. */
    #einlagern { display: grid; gap: 8px; padding: 12px; }
    #einlagern label.field { gap: 2px; font-size: 11px; min-width: 0; }
    #einlagern input:not([type="checkbox"]), #einlagern select {
      width: 100%; min-width: 0; padding: 7px 9px; font-size: 16px;      /* 16px: kein Zoom am iPhone */
      height: 40px; box-sizing: border-box; }
    #einlagern input[type="number"] { -moz-appearance: textfield; appearance: textfield; }
    #einlagern input[type="number"]::-webkit-inner-spin-button,
    #einlagern input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    #einlagern .ef-knopf { height: 40px; }
    #einlagern .ef-code { display: flex; gap: 8px; align-items: baseline; font-size: 13px; min-width: 0; }
    #einlagern .ef-code .mono { font-size: 16px; letter-spacing: .03em; color: var(--text); }
    #einlagern .ef-zeile { display: flex; gap: 8px; align-items: flex-end; min-width: 0; }
    #einlagern .ef-drei { display: grid; grid-template-columns: 1fr 1fr .8fr; gap: 8px; }
    #einlagern .ef-hinweis { font-size: 12px; margin-top: -4px; }
    #einlagern .ef-hinweis:empty { display: none; }
    #einlagern .ef-knopf { padding: 7px 10px; font-size: 15px; white-space: nowrap; flex: none; }
    #einlagern .ef-chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-top: -2px; }
    #einlagern .ef-chips::-webkit-scrollbar { display: none; }
    #einlagern .ef-chips button { flex: none; white-space: nowrap; padding: 5px 9px; }
    #einlagern .ef-stepper { display: flex; gap: 4px; }
    #einlagern .ef-stepper input { width: 44px; text-align: center; padding: 7px 2px; }
    #einlagern .ef-stepper .ef-knopf { width: 36px; padding: 0; }
    #einlagern .ef-druck { flex: none; padding-bottom: 8px; font-size: 14px; }
    /* MHD: Datum und Kamera als ein Feld. iOS zeichnet ein Datumsfeld
       eigen (hoeher, Text mittig) - deshalb feste Hoehe, ohne eigene Optik,
       Text links; der Knopf streckt sich auf dieselbe Hoehe. */
    #einlagern .ef-mhd { display: flex; align-items: stretch; height: 40px; }
    #einlagern .ef-mhd input[type="date"] { flex: 1; min-width: 0; height: 40px; -webkit-appearance: none; appearance: none;
      border-top-right-radius: 0; border-bottom-right-radius: 0; text-align: left; }
    #einlagern .ef-mhd input[type="date"]::-webkit-date-and-time-value { text-align: left; }
    #einlagern .ef-mhd input[type="date"]:only-child { border-radius: var(--radius); }
    #einlagern .ef-mhd button { flex: none; width: 52px; padding: 0; font-size: 20px; margin-left: -1px;
      border-top-left-radius: 0; border-bottom-left-radius: 0; }
    #m-list .swipe-inner { padding: 8px 12px; }
    #m-list .swipe-inner .s { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    nav.bottom {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
      display: grid; grid-template-columns: repeat(5, 1fr);
      background: var(--surface); border-top: 1px solid var(--border);
      padding-bottom: env(safe-area-inset-bottom);
    }
    nav.bottom button {
      border: 0; background: none; color: var(--muted);
      padding: 10px 4px; font-size: 11px; border-radius: 0;
      display: flex; flex-direction: column; align-items: center; gap: 3px;
    }
    nav.bottom button .ico { font-size: 19px; line-height: 1; }
    nav.bottom button.active { color: var(--primary); }

    /* Suche oben in der Liste - am Telefon ist "Hab ich noch Hackfleisch?"
       die haeufigste Frage, und bei hundert Artikeln hilft Scrollen nicht. */
    .msearch { position: sticky; top: 49px; z-index: 15; padding: 10px 12px 0; background: var(--bg); }
    .msearch input[type="search"] { width: 100%; padding: 11px 12px; font-size: 16px; }
    .list .hint { text-align: center; }
    .swipe-inner .acts { display: flex; gap: 8px; margin-top: 10px; }
    .swipe-inner .acts[hidden] { display: none; }
    .swipe-inner .acts button { flex: 1; padding: 9px; font-size: 14px; }

    /* Meldungen ueber der unteren Leiste, nicht dahinter - sonst liegt der
       Rueckgaengig-Knopf genau unter den Reitern. */
    #toasts { left: 12px; right: 12px; bottom: calc(70px + env(safe-area-inset-bottom)); }

    #scanview { padding: 12px; }
    #scanview .kamera-bild { aspect-ratio: 4/3; }
    /* Barcodes sind breit und flach - der Rahmen auch. Erkannt wird im ganzen Bild. */
    #scanview .kamera-ziel { left: 8%; right: 8%; top: 28%; height: 44%; }

    /* Formulare am Telefon: volle Breite, Finger-taugliche Hoehe. */
    .mform { padding: 12px; display: flex; flex-direction: column; gap: 12px; }
    .mform label.field > span { font-size: 12px; color: var(--muted); }
    .mform input, .mform select { padding: 11px 12px; font-size: 16px; }
    .mform .tag-plus { width: 38px; height: 38px; }
  </style>
</head>
<body>

<header class="m">
  <h1 id="m-title">Inventar</h1>
  <span class="pill" id="m-count">–</span>
  <a class="linkbtn" href="/?desktop=1" title="Zur vollen Verwaltung">🖥️ Verwaltung</a>
</header>

<div id="m-view"></div>

<nav class="bottom" id="m-nav">
  <button data-view="inv" class="active"><span class="ico">📦</span>Inventar</button>
  <button data-view="exp"><span class="ico">⏰</span>Ablaufend</button>
  <button data-view="scan"><span class="ico">📷</span>Scan</button>
  <button data-view="ein"><span class="ico">📥</span>Einlagern</button>
  <button data-view="tpl"><span class="ico">📋</span>Vorlagen</button>
</nav>

<div id="toasts"></div>
<script type="module">
import { get, post, del, put, toast, blitz, auslagern, fmtDate, daysPill, esc, gruppieren, mengeText, EINHEITEN, liveConnect, tagEditor, HAUSHALT, fremdHinweis, zielOptionen, zielAuswerten, zielVorauswahl } from '/static/js/api.js';
import { mhdKamera, jpegAus } from '/static/js/mhdkamera.js';
import { kameraHolen, kameraFreigeben } from '/static/js/kamera.js';

// Wer die Handyansicht oeffnet, hat sich fuer sie entschieden - die
// Weiterleitung auf der grossen Seite gilt dann wieder (siehe index.html).
try { localStorage.removeItem('ls-desktop'); } catch { /* privates Fenster */ }

const view = document.getElementById('m-view');
const title = document.getElementById('m-title');
const count = document.getElementById('m-count');
let current = 'inv';

const TITLES = { inv: 'Inventar', exp: 'Ablaufend', scan: 'Scannen', ein: 'Einlagern', tpl: 'Vorlagen' };

document.getElementById('m-nav').addEventListener('click', (ev) => {
  const btn = ev.target.closest('button[data-view]');
  if (!btn) return;
  [...document.querySelectorAll('#m-nav button')].forEach((b) => b.classList.toggle('active', b === btn));
  current = btn.dataset.view;
  title.textContent = TITLES[current];
  render();
});

async function render() {
  stopCamera();
  try {
    if (current === 'inv') await renderList('/api/inventory?limit=300&sort=expiry');
    else if (current === 'exp') await renderList('/api/inventory?expiring=true&limit=200');
    else if (current === 'scan') renderScan();
    else if (current === 'tpl') await renderTemplates();
    else await renderEinlagern();
  } catch (e) { toast(e.message, 'error'); }
}

// Die Suche bleibt beim Wechsel zwischen Inventar und Ablaufend erhalten.
let suche = '';
let listUrl = '';
let ueberall = false;
// Aufgeklappte Gruppen bleiben offen, wenn die Liste neu gefuellt wird
// (Suche, Auslagern, Live-Aktualisierung).
const offeneGruppen = new Set();

async function renderList(url) {
  listUrl = url;
  view.innerHTML = `
    <div id="m-fremd"></div>
    <div class="msearch"><input id="m-q" type="search" placeholder="Suchen: Name, Marke, Etikett"
      value="${esc(suche)}" autocomplete="off" enterkeyhint="search" aria-label="Suchen">
      ${HAUSHALT ? `<label class="row tight" style="margin-top:6px;font-size:14px">
        <input type="checkbox" id="m-alle" ${ueberall ? 'checked' : ''}> auch in anderen Haushalten suchen</label>` : ''}</div>
    <div class="list" id="m-list"></div>`;
  fremdHinweis(document.getElementById('m-fremd')).catch(() => {});
  document.getElementById('m-alle')?.addEventListener('change', (ev) => {
    ueberall = ev.target.checked;
    fillList().catch((e) => toast(e.message, 'error'));
  });
  let timer;
  document.getElementById('m-q').addEventListener('input', (ev) => {
    clearTimeout(timer);
    timer = setTimeout(() => { suche = ev.target.value.trim(); fillList().catch((e) => toast(e.message, 'error')); }, 250);
  });
  await fillList();
}

// Nur die Liste neu fuellen, nicht die Suche: sonst verliert das Feld bei
// jedem Buchstaben den Fokus und die Tastatur klappt zu.
async function fillList() {
  const box = document.getElementById('m-list');
  if (!box) return;
  const rows = await get(listUrl + (suche ? `&q=${encodeURIComponent(suche)}` : '')
    + (ueberall && suche ? '&alle=true' : ''));
  count.textContent = rows.length;
  const leer = suche ? `Nichts gefunden für „${esc(suche)}“.` : 'Nichts vorhanden.';
  const fremd = (i) => (HAUSHALT && i.household !== HAUSHALT.name
    ? ` <span class="pill warn">🏠 ${esc(i.household)}</span>` : '');
  const karte = (i, titel, zeile) => `
    <div class="swipe" data-label="${esc(i.label)}">
      <div class="swipe-action">auslagern</div>
      <div class="swipe-inner" role="button" tabindex="0" aria-expanded="false">
        <div class="kopf"><div class="t">${titel}</div>${daysPill(i.days_left)}</div>
        ${zeile ? `<div class="s">${zeile}</div>` : ''}
        <div class="acts" hidden>
          <button class="primary" data-act="remove">Auslagern</button>
          <button data-act="reprint">Etikett nachdrucken</button>
        </div>
      </div>
    </div>`;
  const einzeln = (i) => karte(i, esc(i.display_name || i.name) + fremd(i),
    [i.brand, mengeText(+i.quantity, i.unit), i.location, fmtDate(i.expiry_date)].filter(Boolean).map(esc).join(' · '));
  // In der Gruppe stehen Name und Marke schon oben, der Ort als
  // Zwischenueberschrift - je Packung bleibt Menge und MHD. Lange Ortsnamen
  // ("Gefriertruhe (extern)") schnitten sonst das Datum ab.
  const packung = (i) => karte(i,
    [mengeText(+i.quantity, i.unit), fmtDate(i.expiry_date)].filter(Boolean).map(esc).join(' · ') || esc(i.name), '');
  const nachOrt = (items) => {
    const orte = new Map();
    for (const i of items) {
      const o = i.location || 'ohne Ort';
      if (!orte.has(o)) orte.set(o, []);
      orte.get(o).push(i);
    }
    return [...orte.entries()].map(([o, liste]) => `<div class="g-ort">📍 ${esc(o)}${
      liste.length > 1 ? ` <span class="muted">· ${liste.length}</span>` : ''}</div>${liste.map(packung).join('')}`).join('');
  };
  const gruppe = (g) => {
    const e = g.erster, offen = offeneGruppen.has(g.key);
    return `<div class="gruppe" data-key="${esc(g.key)}">
      <div class="swipe-inner gkopf" role="button" tabindex="0" aria-expanded="${offen}">
        <div class="kopf"><div class="t">${esc(e.display_name || e.name)}${fremd(e)}</div>
          <span class="pill anzahl">${g.items.length}×</span>${daysPill(e.days_left)}</div>
        <div class="s">${[e.brand, mengeText(g.menge, e.unit),
          g.orte.length > 1 ? `${g.orte.length} Orte` : g.orte[0],
          e.expiry_date ? `ab ${fmtDate(e.expiry_date)}` : ''].filter(Boolean).map(esc).join(' · ')}</div>
      </div>
      <div class="gliste"${offen ? '' : ' hidden'}>${nachOrt(g.items)}</div>
    </div>`;
  };
  box.innerHTML = rows.length ? `
    <div class="hint">Antippen für Aktionen · nach links wischen lagert aus</div>
    ${gruppieren(rows).map((g) => (g.items.length > 1 ? gruppe(g) : einzeln(g.items[0]))).join('')}`
    : `<div class="empty">${leer}</div>`;
  box.querySelectorAll('.gkopf').forEach((kopf) => kopf.addEventListener('click', () => {
    const g = kopf.closest('.gruppe'), liste = g.querySelector('.gliste');
    liste.hidden = !liste.hidden;
    kopf.setAttribute('aria-expanded', String(!liste.hidden));
    if (liste.hidden) offeneGruppen.delete(g.dataset.key); else offeneGruppen.add(g.dataset.key);
  }));
  attachSwipe();
  attachTap();
}

// Antippen klappt die Aktionen auf. Wischen allein war nicht zu entdecken -
// nichts an der Karte verriet, dass sie sich bewegen laesst.
function attachTap() {
  view.querySelectorAll('.swipe').forEach((card) => {
    const inner = card.querySelector('.swipe-inner');
    const acts = card.querySelector('.acts');
    inner.addEventListener('click', async (ev) => {
      if (card._swiped) { card._swiped = false; return; }
      const btn = ev.target.closest('button[data-act]');
      if (!btn) {
        const offen = acts.hidden;
        view.querySelectorAll('.acts').forEach((a) => { a.hidden = true; a.closest('.swipe-inner').setAttribute('aria-expanded', 'false'); });
        acts.hidden = !offen;
        inner.setAttribute('aria-expanded', String(offen));
        return;
      }
      btn.disabled = true;
      try {
        if (btn.dataset.act === 'remove') {
          await auslagern(card.dataset.label, 'mobile', fillList);
          await fillList(); // Gruppe zaehlt neu
        } else {
          const r = await post(`/api/labels/reprint/${encodeURIComponent(card.dataset.label)}`);
          toast(r.sent ? 'Druckauftrag gesendet' : 'Eingereiht – kein Terminal online', r.sent ? 'success' : 'warn');
          btn.disabled = false;
        }
      } catch (e) { toast(e.message, 'error'); btn.disabled = false; }
    });
  });
}

// Wischgeste: nur horizontal, ab 90 px wird ausgelagert. Vertikales Scrollen
// bleibt dem Browser ueberlassen (touch-action: pan-y).
function attachSwipe() {
  view.querySelectorAll('.swipe').forEach((card) => {
    const inner = card.querySelector('.swipe-inner');
    let startX = 0, startY = 0, dx = 0, locked = null;

    inner.addEventListener('touchstart', (e) => {
      startX = e.touches[0].clientX; startY = e.touches[0].clientY;
      dx = 0; locked = null; inner.style.transition = 'none';
    }, { passive: true });

    inner.addEventListener('touchmove', (e) => {
      const cx = e.touches[0].clientX - startX;
      const cy = e.touches[0].clientY - startY;
      if (locked === null) locked = Math.abs(cx) > Math.abs(cy) ? 'x' : 'y';
      if (locked !== 'x') return;
      dx = Math.min(0, cx);
      inner.style.transform = `translateX(${dx}px)`;
    }, { passive: true });

    inner.addEventListener('touchend', async () => {
      inner.style.transition = '';
      card._swiped = Math.abs(dx) > 10;
      if (dx < -90) {
        inner.style.transform = 'translateX(-100%)';
        try {
          await auslagern(card.dataset.label, 'mobile', fillList);
          await fillList(); // Gruppe zaehlt neu
        } catch (e) { toast(e.message, 'error'); inner.style.transform = ''; }
      } else {
        inner.style.transform = '';
      }
    });
  });
}

// -------------------------------------------------------------------- Scannen
//
// Zwei Dinge muessen stimmen, damit die Kamera scannt, und sie haben nichts
// miteinander zu tun:
//
//   1. Zugriff auf die Kamera. Den gibt jeder Browser nur in einem sicheren
//      Kontext her - also ueber HTTPS oder auf localhost. Ueber http:// an
//      einer LAN-Adresse gibt es `navigator.mediaDevices` schlicht nicht.
//   2. Ein Decoder. Chrome und Android bringen `BarcodeDetector` mit, Safari
//      nicht - und auf dem iPhone ist jeder Browser Safari. Dafuer liegt
//      ZXing in js/vendor, nachgeladen nur wenn noetig.
//
// Frueher stand hier eine einzige Meldung "wird von diesem Browser nicht
// unterstuetzt" fuer beide Faelle. Die war doppelt falsch: am iPhone lag es
// nicht am Browser, sondern am fehlenden Decoder, und wer ueber http zugreift,
// haette ewig nach einem anderen Browser gesucht.
let stream = null, detectTimer = null, zxingReader = null;

function kameraMoeglich() {
  return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
}

function ladeZXing() {
  if (window.ZXing) return Promise.resolve();
  return new Promise((ok, fail) => {
    const tag = document.createElement('script');
    tag.src = '/static/js/vendor/zxing.min.js';
    tag.onload = ok;
    tag.onerror = () => fail(new Error('Decoder liess sich nicht laden'));
    document.head.appendChild(tag);
  });
}

function renderScan() {
  count.textContent = '';
  const kamera = kameraMoeglich();
  const hinweis = kamera ? '' : `<div class="card">
      <b>Die Kamera ist hier nicht verfügbar.</b><br>
      Browser geben sie nur über eine gesicherte Verbindung frei. Diese Seite
      läuft über <span class="mono">${esc(location.protocol)}//${esc(location.host)}</span>.
      Über <b>https://</b> oder direkt am Rechner (localhost) geht es; am
      einfachsten mit einem Reverse Proxy oder einem Tunneldienst vor dem
      Container. Bis dahin den Code bitte eintippen.</div>`;

  view.innerHTML = `<div id="scanview">
    ${kamera ? `<div class="kamera">
      <div class="kamera-titel">Barcode / Label scannen</div>
      <div class="kamera-bild"><video id="cam" playsinline muted autoplay></video>
        <div class="kamera-ziel" id="scanziel"></div></div>
      <div class="kamera-info" id="scanhint">Code in den Rahmen halten</div>
    </div>` : hinweis}
    <form class="row" id="manual" style="margin-top:12px">
      <input id="code" placeholder="Barcode / LEB000123" style="flex:1" inputmode="text">
      <button class="primary">Senden</button>
    </form>
    <p class="muted" style="margin-top:10px">
      Eigenes Etikett = auslagern. Produkt-Barcode = einlagern – Stückzahl, MHD und Ort
      gibst du danach hier am Handy ein.</p>
    <div id="scanresult"></div></div>`;

  document.getElementById('manual').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const code = document.getElementById('code').value.trim();
    if (!code) return;
    document.getElementById('code').value = '';   // vorher: sendScan baut die Ansicht evtl. um
    await sendScan(code);
  });

  if (kamera) startCamera();
}

// Entprellen. Die Kamera liefert denselben Code zehnmal pro Sekunde, und ein
// zweiter Scan desselben Etiketts bucht es wieder ein - haelt man das Etikett
// nach dem Auslagern nur eine Sekunde zu lang vor die Linse, waere es also
// sofort wieder im Bestand. Deshalb nach jedem Treffer eine harte Pause, in
// der gar nichts angenommen wird, und nicht nur eine Sperre je Code.
const SCAN_PAUSE_MS = 4000;
let pauseBis = 0;
async function treffer(value) {
  if (!value || Date.now() < pauseBis) return;
  pauseBis = Date.now() + SCAN_PAUSE_MS;
  navigator.vibrate?.(60);
  blitz();
  // Wie bei der MHD-Kamera: der Rahmen zeigt den Treffer.
  const ziel = document.getElementById('scanziel');
  if (ziel) {
    ziel.classList.add('treffer');
    setTimeout(() => ziel.classList.remove('treffer'), 1200);
  }
  await sendScan(value);
}

async function startCamera() {
  const hint = document.getElementById('scanhint');
  try {
    stream = await kameraHolen();
  } catch (e) {
    toast(`Kamera nicht verfügbar: ${e.message}`, 'warn');
    return;
  }
  const cam = document.getElementById('cam');
  if (!cam) return;
  cam.srcObject = stream;
  // iOS spielt erst nach play() ab, obwohl autoplay gesetzt ist.
  cam.play?.().catch(() => {});

  if ('BarcodeDetector' in window) {
    const detector = new BarcodeDetector({
      formats: ['ean_13', 'ean_8', 'code_128', 'code_39', 'upc_a', 'upc_e', 'qr_code'],
    });
    detectTimer = setInterval(async () => {
      try {
        const codes = await detector.detect(cam);
        if (codes.length) await treffer(codes[0].rawValue);
      } catch { /* Einzelbild ohne Treffer */ }
    }, 350);
    return;
  }

  // Safari: Decoder nachladen. Er bringt seine eigene Kameraschleife mit und
  // uebernimmt das laufende Bild, statt ein zweites Mal darauf zuzugreifen.
  if (hint) hint.textContent = 'Decoder wird geladen …';
  try {
    await ladeZXing();
  } catch (e) {
    toast(e.message, 'error');
    if (hint) hint.textContent = 'Decoder nicht verfügbar - Code bitte eintippen.';
    return;
  }
  if (hint) hint.textContent = 'Code in den Rahmen halten';

  const hints = new Map();
  hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
    ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8,
    ZXing.BarcodeFormat.UPC_A, ZXing.BarcodeFormat.UPC_E,
    ZXing.BarcodeFormat.CODE_128, ZXing.BarcodeFormat.CODE_39,
    ZXing.BarcodeFormat.QR_CODE,
  ]);
  zxingReader = new ZXing.BrowserMultiFormatReader(hints, { delayBetweenScanAttempts: 250 });
  // Eine Kopie des Stroms: reset() beendet die Spuren, die der Decoder bekam -
  // das Original bleibt fuer die naechste Kamera stehen (kamera.js).
  zxingReader.decodeFromStream(stream.clone(), cam, (result) => {
    if (result) treffer(result.getText());
  }).catch((e) => toast(`Erkennung fehlgeschlagen: ${e.message}`, 'error'));
}

function stopCamera() {
  if (detectTimer) { clearInterval(detectTimer); detectTimer = null; }
  // Der nachgeladene Decoder haelt eine eigene Schleife auf dem Videobild.
  // Ohne dieses reset() laeuft sie weiter, wenn man den Reiter wechselt - das
  // frisst Akku und liefert Treffer fuer einen Bildschirm, der gar nicht mehr
  // offen ist.
  if (zxingReader) {
    try { zxingReader.reset(); } catch { /* schon beendet */ }
    zxingReader = null;
  }
  const cam = document.getElementById('cam');
  if (cam) cam.srcObject = null;
  if (stream) { kameraFreigeben(); stream = null; }
}

async function sendScan(code) {
  try {
    const res = await post('/api/inventory/scan', { code });
    const box = document.getElementById('scanresult');
    if (res.action === 'removed' || res.action === 'restored') {
      // Bewusst kein render(): das wuerde den Scan-Bildschirm neu aufbauen,
      // die Kamera neu starten und die Pause oben zuruecksetzen - das Etikett
      // liefe dann in einer Schleife aus dem Bestand und wieder hinein.
      const wort = res.action === 'removed' ? 'ausgelagert' : 'wieder eingebucht';
      toast(`${res.name || res.label} ${wort}`, 'success');
      if (box) {
        box.innerHTML = `<div class="card" style="margin-top:12px">
          <b>${esc(res.name || res.label)}</b>
          <div class="muted">${wort}</div>
          <div class="mono muted">${esc(res.label)}</div></div>`;
      }
    } else if (res.action === 'unknown_label') {
      toast(`Etikett ${res.label} ist nicht im Bestand`, 'warn');
    } else if (res.action === 'product') {
      // Einlagern macht das Handy selbst - wie am Terminal, nur hier.
      await einlagernFormular(res.code || code, res.product);
    } else if (res.routed_to) {
      toast(`${code} an ${res.routed_to} gesendet`, 'success');
    }
  } catch (e) { toast(e.message, 'error'); }
}

// Einlagern am Handy: dieselben Angaben wie am Terminal (Name, MHD,
// Stueckzahl, Ort), danach POST /api/labels - derselbe Weg wie die
// Verwaltung, mit Etikettennummer, Protokoll und Druckauftrag.
const ORT_KEY = 'ls-mobil-ort';
function plusTage(tage) {
  // Lokales Datum, nicht toISOString(): das ist UTC und laege kurz nach
  // Mitternacht einen Tag zurueck.
  const d = new Date(); d.setDate(d.getDate() + tage);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
// Kopf der Maske ohne Vorlage: alles frei einzugeben.
function freierKopf(p, kategorien, kiStatus, opt, mhdKnoepfe, mhdWege) {
  return `
    <div class="ef-zeile">
      <label class="field" style="flex:1">Name<input name="name" value="${esc(p.name || '')}" required
        ${p.name ? '' : 'autofocus'}></label>
      ${kiStatus.aktiv ? '<button type="button" class="ef-knopf" id="ki-knopf" title="KI-Vorschlag">✨</button>' : ''}
    </div>
    ${kiStatus.aktiv ? '<div class="muted ef-hinweis" id="ki-text"></div>' : ''}
    <div class="ef-drei">
      <label class="field">Marke<input name="brand" list="marken" value="${esc(p.brand || '')}">
        <datalist id="marken"></datalist></label>
      <label class="field">Kategorie<select name="category"><option value=""></option>${
        opt(kategorien.map((k) => k.name), p.category || '')}</select></label>
      <label class="field">Sorte<input name="subcategory" list="sorten" value="${esc(p.subcategory || '')}">
        <datalist id="sorten"></datalist></label>
    </div>
    <label class="field">MHD<span class="ef-mhd">
      <input name="expiry_date" type="date" value="${esc(p.expiry_date || '')}">
      ${mhdWege.lokal || mhdWege.ki ? `<button type="button" id="mhd-foto" title="MHD mit der Kamera lesen"
          aria-label="MHD mit der Kamera lesen">📷</button>
        <input type="file" accept="image/*" capture="environment" id="mhd-datei" hidden>` : ''}
    </span></label>
    <div class="muted ef-hinweis" id="mhd-quelle"></div>
    <div class="ef-chips">
      ${mhdKnoepfe.map(([t, d]) => `<button type="button" class="sm" data-tage="${d}">${t}</button>`).join('')}
      <button type="button" class="sm ghost" data-tage="">kein MHD</button>
    </div>
`;
}

// Kopf der Maske mit Vorlage: steht alles schon fest und wird nur gezeigt.
// Das MHD kommt aus der Haltbarkeit der Vorlage fuer die Lagerart des Orts
// (wie am Terminal) und folgt dem Ort. Gefragt wird nur, was die Vorlage
// offen laesst: die Marke bei mehreren, die Sorte bei "Sorte abfragen".
function vorlageKopf(vorlage, p, vorlageSorten) {
  const marken = vorlage.brands || [];
  return `<div>
      <div style="font-size:22px;font-weight:600">${esc(vorlage.name)}</div>
      <div class="muted" style="font-size:13px">Vorlage · ${esc(vorlage.category || '')}</div>
    </div>
    <input type="hidden" name="name" value="${esc(vorlage.name)}">
    <input type="hidden" name="category" value="${esc(vorlage.category || '')}">
    ${marken.length > 1 ? `<label class="field">Marke<select name="brand">
        ${marken.map((m) => `<option>${esc(m)}</option>`).join('')}<option value="">ohne Marke</option></select></label>`
    : `<input type="hidden" name="brand" value="${esc(marken[0] || '')}">
       ${marken.length ? `<div class="muted">Marke <b>${esc(marken[0])}</b></div>` : ''}`}
    ${vorlage.use_sorten ? `<label class="field">Was ist es?<select name="subcategory" required>
        <option value="">bitte wählen</option>${vorlageSorten.map((n) => `<option>${esc(n)}</option>`).join('')}</select></label>`
    : '<input type="hidden" name="subcategory" value="">'}
    <input type="hidden" name="expiry_date" value="">
    <div><span class="muted" style="font-size:13px">MHD</span>
      <div style="font-size:18px" id="mhd-text">–</div>
      <span class="muted" id="mhd-quelle" style="font-size:12px"></span></div>
  `;
}

// `vorlage`: Einlagern ohne Barcode ueber eine Vorlage (Marken, Sorten,
// Einheit, Haltbarkeit von dort). `danach`: wohin es nach dem Speichern oder
// Abbrechen geht - Standard ist zurueck zum Scannen.
async function einlagernFormular(code, produkt, vorlage = null, danach = null) {
  const zurueck = danach || (() => renderScan());
  stopCamera();
  const [kategorien, orte, ziele, kiStatus, mhdWege] = await Promise.all([
    get('/api/categories'), get('/api/locations'),
    get('/api/labels/ziele').catch(() => ({ standard: 'terminal', brother: false, terminals: [] })),
    get('/api/ki').catch(() => ({ aktiv: false })),
    get('/api/mhd').catch(() => ({ lokal: false, ki: false }))]);
  // "Drucken an": Brother / Terminal(s), vorausgewaehlt das Standardziel.
  const zielListe = zielOptionen(ziele);
  const zielStart = zielVorauswahl(zielListe, ziele.standard);
  let ort = '';
  try { ort = localStorage.getItem(ORT_KEY) || ''; } catch { /* privat */ }
  if (!orte.some((o) => o.name === ort)) ort = (orte.find((o) => o.is_default) || orte[0] || {}).name || '';
  const p = produkt || {};
  const opt = (liste, wert) => liste.map((n) => `<option ${n === wert ? 'selected' : ''}>${esc(n)}</option>`).join('');
  // Sorten der Vorlage, sonst die der Kategorie (Fleisch: Schwein, ...).
  const vorlageSorten = vorlage ? ((vorlage.sorten || []).length ? vorlage.sorten
    : (kategorien.find((k) => k.name === vorlage.category)?.subcategories || [])) : [];
  const mhdKnoepfe = [['+3 T', 3], ['+1 W', 7], ['+2 W', 14], ['+1 M', 30], ['+3 M', 90], ['+6 M', 180], ['+1 J', 365]];

  // Alles auf einen Bildschirm: kleine Feldnamen, mehrere Felder je Zeile,
  // die MHD-Knoepfe in einer seitlich wischbaren Reihe (Stil #einlagern oben).
  view.innerHTML = `<form class="card" id="einlagern">
    ${code && !vorlage ? `<label class="ef-frost${p.gefroren ? ' an' : ''}">
      <input type="checkbox" name="gefroren" ${p.gefroren ? 'checked' : ''}>
      <span class="flocke" aria-hidden="true">❄️</span>
      <span>Im Original gefroren<small>MHD bleibt im Gefrierschrank, wie es auf der Packung steht</small></span>
    </label>` : ''}
    ${code ? `<div class="ef-code"><span class="mono">${esc(code)}</span>
      <span class="muted">${produkt ? 'erkannt' : 'unbekannt – bitte Namen eingeben'}</span></div>`
    : vorlage ? '' : `<div class="ef-code muted">Ohne Vorlage · ${esc(p.category || '')}</div>`}
    ${vorlage ? vorlageKopf(vorlage, p, vorlageSorten) : freierKopf(p, kategorien, kiStatus, opt, mhdKnoepfe, mhdWege)}
    <div class="ef-zeile">
      ${vorlage?.unit ? `<label class="field" style="flex:1">Menge (${esc(vorlage.unit)})
        <input name="quantity" type="number" step="any" min="0" value="1" inputmode="decimal">
        <input type="hidden" name="unit" value="${esc(vorlage.unit)}"></label>`
    : `<label class="field" style="flex:1">Menge<input name="quantity" type="number" step="any" min="0"
          inputmode="decimal" value="${p.menge ?? ''}" placeholder="optional"></label>
        <label class="field" style="width:76px">Einheit<select name="unit">${
          opt(EINHEITEN, p.einheit || '')}</select></label>`}
      <label class="field">Etiketten<span class="ef-stepper">
        <button type="button" class="ef-knopf" data-anzahl="-1">−</button>
        <input name="count" type="number" min="1" max="20" value="1" inputmode="numeric">
        <button type="button" class="ef-knopf" data-anzahl="1">+</button></span></label>
    </div>
    <div class="ef-zeile">
      <label class="field" style="flex:1">Lagerort<select name="location">${opt(orte.map((o) => o.name), ort)}</select></label>
      <label class="row tight ef-druck"><input type="checkbox" name="print" checked> drucken</label>
    </div>
    <label class="field" id="ziel-wahl" ${zielListe.length > 1 ? '' : 'hidden'}>Drucken an
      <select name="ziel">${zielListe.map(([w, t]) => `<option value="${esc(w)}" ${w === zielStart ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select></label>
    <div class="row" style="gap:10px">
      <button type="button" class="ghost" id="abbrechen" style="flex:1">Abbrechen</button>
      <button class="primary" style="flex:2">Einlagern</button>
    </div>
  </form>`;

  const form = document.getElementById('einlagern');
  const sorten = () => {
    const liste = document.getElementById('sorten');
    if (!liste) return;              // Vorlage mit fester Sortenauswahl
    const k = kategorien.find((x) => x.name === form.category.value);
    liste.innerHTML = (k?.subcategories || [])
      .map((s) => `<option value="${esc(s)}">`).join('');
  };
  sorten();

  // Gefroren gekauft gehoert in den Gefrierschrank - dann stehen nur dessen
  // Orte zur Wahl. Frisches darf ueberall hin (eingefroren wird es
  // verlaengert). Ohne Gefrierort bleibt alles waehlbar. Lagerart wie im
  // Server (Location.kind, sonst haltbarkeit.art_raten nach dem Namen).
  const ortArt = (o) => o.kind || (/gefrier|truhe|tiefk(ü|ue)hl|frost|eis/i.test(o.name) ? 'tiefkuehl'
    : /k(ü|ue)hl|fridge/i.test(o.name) ? 'kuehl' : 'raum');
  function orteFiltern() {
    const nurTief = form.gefroren?.checked;
    const tief = orte.filter((o) => ortArt(o) === 'tiefkuehl');
    const liste = nurTief && tief.length ? tief : orte;
    const alt = form.location.value;
    const neu = liste.some((o) => o.name === alt) ? alt : (liste[0] || {}).name || '';
    form.location.innerHTML = opt(liste.map((o) => o.name), neu);
    return neu !== alt;
  }
  orteFiltern();

  // MHD-Vorschlag: haengt am Lagerort (Raum/Kuehl/Gefrier) und an der
  // Kategorie, und folgt beiden, bis man das Datum selbst setzt.
  let mhdVonHand = false;
  // Das Datum von der Packung (gescannt oder eingetippt). Im Gefrierschrank
  // verlaengert es der Server, ausser die Ware ist schon tiefgekuehlt
  // gekauft - dann bleibt es 1:1 (/api/haltbarkeit/eingefroren).
  let aufgedruckt = '';
  let kiHalt = null;
  const ARTNAME = { raum: 'Raumtemperatur', kuehl: 'Kühlschrank', tiefkuehl: 'Gefrierschrank' };
  const quelle = document.getElementById('mhd-quelle');
  async function mhdNeu() {
    if (mhdVonHand) return;
    const ort = orte.find((o) => o.name === form.location.value);
    const art = ort?.kind || '';
    if (kiHalt && art && kiHalt[art]) {
      form.expiry_date.value = plusTage(kiHalt[art]);
      quelle.textContent = `Vorschlag der KI · ${ARTNAME[art]}: ${kiHalt[art]} Tage`;
      return;
    }
    try {
      const v = await get(`/api/haltbarkeit/vorschlag?ort=${encodeURIComponent(form.location.value)}`
        + `&kategorie=${encodeURIComponent(form.category.value)}&barcode=${encodeURIComponent(code)}`
        + (vorlage ? `&vorlage=${vorlage.id}` : ''));
      if (mhdVonHand) return;
      form.expiry_date.value = v.datum || '';
      const text = document.getElementById('mhd-text');
      if (text) text.textContent = v.datum ? v.datum.split('-').reverse().join('.') : 'kein MHD';
      quelle.textContent = v.datum ? `Vorschlag: ${v.quelle} · ${v.tage} Tage`
        : `Kein Vorschlag${art ? ` für ${ARTNAME[art]}` : ''} – Datum bitte setzen`;
    } catch { /* bleibt, wie es ist */ }
  }
  const anzeigen = (iso) => iso.split('-').reverse().join('.');
  // Nur die juengste Rechnung zaehlt (Ort/Kategorie koennen sich waehrend
  // einer Anfrage aendern), und Speichern wartet auf sie.
  let einfrierNr = 0;
  let einfrierLauf = Promise.resolve();
  function einfrieren(text) {
    einfrierLauf = einfrierenRechnen(text, ++einfrierNr);
    return einfrierLauf;
  }
  async function einfrierenRechnen(text, nr) {
    if (!aufgedruckt) return;
    form.expiry_date.value = aufgedruckt;
    quelle.textContent = text;
    try {
      const v = await get(`/api/haltbarkeit/eingefroren?mhd=${aufgedruckt}`
        + `&ort=${encodeURIComponent(form.location.value)}`
        + (form.gefroren ? `&gefroren=${form.gefroren.checked}` : '')
        + `&kategorie=${encodeURIComponent(form.category.value)}&barcode=${encodeURIComponent(code)}`
        + (vorlage ? `&vorlage=${vorlage.id}` : ''));
      if (nr !== einfrierNr || form.expiry_date.value !== aufgedruckt) return;   // inzwischen anders gesetzt
      form.expiry_date.value = v.datum || aufgedruckt;
      if (v.verlaengert) quelle.textContent = `${anzeigen(v.datum)} – ${v.hinweis} (Packung ${anzeigen(aufgedruckt)})`;
      else if (v.hinweis) quelle.textContent = `${text} · ${v.hinweis}`;
    } catch { /* bleibt das aufgedruckte */ }
  }
  let einfrierText = 'von Hand gesetzt';
  form.category.addEventListener('change', () => {
    sorten();
    if (aufgedruckt) einfrieren(einfrierText); else mhdNeu();
  });
  form.location.addEventListener('change', () => {
    if (aufgedruckt) einfrieren(einfrierText); else mhdNeu();
  });
  // Haken "Im Original gefroren": falsch erkannt -> hier umstellen. Er wird
  // beim Einlagern am Produkt gemerkt und gilt beim naechsten Scan.
  form.gefroren?.addEventListener('change', () => {
    form.gefroren.closest('.ef-frost').classList.toggle('an', form.gefroren.checked);
    orteFiltern();
    if (aufgedruckt) einfrieren(einfrierText); else mhdNeu();
  });
  form.expiry_date.addEventListener('input', () => { mhdVonHand = true; quelle.textContent = 'von Hand gesetzt'; });
  form.expiry_date.addEventListener('change', () => {
    aufgedruckt = form.expiry_date.value;
    einfrierText = 'von Hand gesetzt';
    einfrieren(einfrierText);
  });
  form.querySelectorAll('[data-tage]').forEach((b) => b.addEventListener('click', () => {
    form.expiry_date.value = b.dataset.tage === '' ? '' : plusTage(+b.dataset.tage);
    mhdVonHand = true;
    aufgedruckt = '';
    quelle.textContent = 'von Hand gesetzt';
  }));

  // MHD scannen: Live-Kamera mit Zielrahmen (js/mhdkamera.js - dieselbe wie
  // auf der Testseite unter System). Ohne Live-Kamera (http) ein einzelnes
  // Foto, gleich mit KI.
  const fotoKnopf = document.getElementById('mhd-foto');
  const fotoDatei = document.getElementById('mhd-datei');
  function mhdUebernehmen(r) {
    mhdVonHand = true;
    aufgedruckt = r.datum;
    einfrierText = `gescannt – bitte prüfen: ${anzeigen(r.datum)}`
      + (r.gelesen ? ` (gelesen „${r.gelesen}“${r.quelle === 'ki' ? ', KI' : ''})` : '');
    einfrieren(einfrierText);
    navigator.vibrate?.(40);
    blitz();
  }
  fotoKnopf?.addEventListener('click', async () => {
    if (!kameraMoeglich()) { fotoDatei.click(); return; }
    try {
      const r = await mhdKamera({ kiErlaubt: mhdWege.ki });
      if (r) mhdUebernehmen(r);
    } catch (e) { toast(e.message, 'warn'); }
  });
  // Einstellung "nach dem Scan gleich das MHD scannen" (System -> Handy):
  // nur nach einem Barcode, die Maske steht schon dahinter. "Ueberspringen"
  // laesst den Vorschlag aus Ort/Kategorie stehen; ein erkanntes Datum
  // landet im Feld und bleibt dort aenderbar wie jedes andere.
  if (code && mhdWege.nach_scan && fotoKnopf && kameraMoeglich()) {
    mhdKamera({ kiErlaubt: mhdWege.ki, endeText: 'Überspringen' })
      .then((r) => { if (r) mhdUebernehmen(r); })
      .catch((e) => toast(e.message, 'warn'));
  }
  fotoDatei?.addEventListener('change', async () => {
    const datei = fotoDatei.files?.[0];
    fotoDatei.value = '';
    if (!datei) return;
    fotoKnopf.disabled = true;
    quelle.textContent = 'Foto wird gelesen …';
    try {
      const bild = await createImageBitmap(datei);
      const r = await post('/api/mhd/foto', { bild: jpegAus(bild, 0, 0, bild.width, bild.height), ki: true, gruendlich: true });
      if (r.datum) mhdUebernehmen(r);
      else quelle.textContent = 'Kein Datum erkannt – näher ran?';
    } catch (e) {
      quelle.textContent = e.message;
    } finally {
      fotoKnopf.disabled = false;
    }
  });

  // KI: Kategorie, Sorte und Haltbarkeit je Lagerart vorschlagen. Gefuellt
  // wird nur, was leer ist - Eingetragenes bleibt.
  const kiKnopf = document.getElementById('ki-knopf');
  const kiText = document.getElementById('ki-text');
  async function kiFragen() {
    const name = form.name.value.trim();
    if (!kiKnopf || !name) return;
    kiKnopf.disabled = true;
    kiText.textContent = 'KI überlegt …';
    try {
      const v = await post('/api/ki/vorschlag', { name, brand: form.brand.value.trim(), barcode: code });
      if (!form.category.value && v.kategorie) { form.category.value = v.kategorie; sorten(); }
      if (!form.subcategory.value && v.sorte) form.subcategory.value = v.sorte;
      kiHalt = v.haltbarkeit || null;
      kiText.textContent = v.hinweis || 'Vorschlag übernommen';
      await mhdNeu();
    } catch (e) {
      kiText.textContent = e.message;
    } finally {
      kiKnopf.disabled = false;
    }
  }
  kiKnopf?.addEventListener('click', kiFragen);
  // Neues Produkt mit Namen, aber ohne Kategorie: gleich fragen.
  if (kiStatus.aktiv && p.name && !p.category) kiFragen();
  mhdNeu();
  // Vorbelegte Zahl verschwindet beim Antippen - sonst wurde aus der "1" mit
  // einer getippten 3 eine 31. Bleibt das Feld leer, kommt die Vorgabe zurueck.
  // Leeren statt select(): das markiert iOS-Safari in Zahlenfeldern nicht.
  [form.quantity, form.count].forEach((feld) => {
    let vorher = '';
    feld.addEventListener('focus', () => { vorher = feld.value; feld.value = ''; });
    feld.addEventListener('blur', () => { if (feld.value === '') feld.value = vorher; });
  });
  form.querySelectorAll('[data-anzahl]').forEach((b) => b.addEventListener('click', () => {
    form.count.value = Math.min(20, Math.max(1, (+form.count.value || 1) + +b.dataset.anzahl));
  }));
  document.getElementById('abbrechen').addEventListener('click', () => zurueck());

  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    document.activeElement?.blur?.();   // geleertes Zahlenfeld bekommt seine Vorgabe zurueck
    const knopf = form.querySelector('button.primary');
    knopf.disabled = true;
    await einfrierLauf;                 // ein gerade eingetipptes MHD erst fertig rechnen
    const menge = parseFloat(form.quantity.value);
    const body = {
      name: form.name.value.trim(),
      barcode: code,
      gefroren: form.gefroren ? form.gefroren.checked : null,
      brand: form.brand.value.trim(),
      category: form.category.value,
      subcategory: form.subcategory.value.trim(),
      expiry_date: form.expiry_date.value,
      quantity: menge > 0 && form.unit.value ? menge : 1,
      unit: menge > 0 ? form.unit.value : '',
      location: form.location.value,
      count: Math.min(20, Math.max(1, +form.count.value || 1)),
      print: form.print.checked,
    };
    // Gibt es nur ein Ziel, entscheidet der Server (Standardziel).
    if (!document.getElementById('ziel-wahl').hidden) zielAuswerten(form.ziel.value, body);
    try {
      const r = await post('/api/labels', body);
      try { localStorage.setItem(ORT_KEY, body.location); } catch { /* privat */ }
      const nummern = r.labels.length > 1 ? `${r.labels[0]} – ${r.labels[r.labels.length - 1]}` : r.labels[0];
      toast(`${body.name} eingelagert · ${nummern}${body.print ? (r.printed ? ' · druckt' : ' · Druck wartet') : ''}`,
        'success');
      navigator.vibrate?.([40, 60, 40]);
      zurueck();
    } catch (e) {
      knopf.disabled = false;
      // Inzwischen ist ein zweites Terminal dazugekommen: jetzt fragen.
      if (e.message.includes('"frage":"terminal"')) {
        try {
          const liste = zielOptionen({ ...ziele, terminals: JSON.parse(e.message).terminals || [] });
          form.ziel.innerHTML = liste.map(([w, t]) =>
            `<option value="${esc(w)}">${esc(t)}</option>`).join('');
          form.ziel.value = zielVorauswahl(liste, 'terminal');
          document.getElementById('ziel-wahl').hidden = false;
          toast('Mehrere Terminals verbunden – bitte wählen, wo gedruckt wird', 'warn');
          return;
        } catch { /* unten als Fehler zeigen */ }
      }
      toast(e.message, 'error');
    }
  });
}

// ----------------------------------------------------------------- Einlagern
// Ohne Barcode einlagern, wie "Kategorie" am Terminal: Kategorie, dann
// Vorlage, dann dieselbe Maske wie nach einem Kamera-Scan. Die Einkaufsliste
// stand vorher hier und wurde nicht gebraucht.
async function renderEinlagern(kategorie = null) {
  count.textContent = '';
  title.textContent = kategorie || TITLES.ein;
  const [kategorien, vorlagen] = await Promise.all([get('/api/categories'), get('/api/templates')]);
  if (!kategorie) {
    view.innerHTML = `<button class="ghost" id="nachdruck" style="width:100%;margin-bottom:10px">🖨️ Letztes Etikett nachdrucken</button>
      <div class="kacheln">${kategorien.map((k) => {
      const n = vorlagen.filter((t) => t.category === k.name).length;
      return `<button class="kachel" data-kat="${esc(k.name)}" style="--farbe:${esc(k.color)}">
        <b>${esc(k.name)}</b><span>${n ? `${n} Vorlage${n === 1 ? '' : 'n'}` : 'frei eingeben'}</span></button>`;
    }).join('')}</div>`;
    view.querySelectorAll('[data-kat]').forEach((b) => b.addEventListener('click', () => renderEinlagern(b.dataset.kat)));
    document.getElementById('nachdruck').addEventListener('click', async (ev) => {
      ev.currentTarget.disabled = true;
      try {
        const r = await post('/api/labels/reprint-last');
        toast(`${r.name} · ${r.label} ${r.sent ? 'druckt' : 'Druck wartet'}`, 'success');
      } catch (e) {
        toast(e.message, 'error');
      } finally {
        ev.currentTarget.disabled = false;
      }
    });
    return;
  }
  const passend = vorlagen.filter((t) => t.category === kategorie);
  view.innerHTML = `<div class="list">
    ${passend.map((t) => `<button class="swipe-inner" data-tpl="${t.id}" style="text-align:left;width:100%">
      <div class="t">${esc(t.name)}</div>
      <div class="s">${haltKurz(t)}${t.use_sorten ? ' · fragt nach Sorte' : ''}${t.unit ? ` · ${esc(t.unit)}` : ''}</div>
    </button>`).join('')}
    <button class="swipe-inner" data-tpl="" style="text-align:left;width:100%">
      <div class="t">Ohne Vorlage</div><div class="s">Name selbst eingeben</div></button>
    <button class="ghost" id="ein-zurueck" style="margin-top:6px">← Kategorien</button>
  </div>`;
  document.getElementById('ein-zurueck').addEventListener('click', () => renderEinlagern());
  view.querySelectorAll('[data-tpl]').forEach((b) => b.addEventListener('click', () => {
    const tpl = passend.find((t) => String(t.id) === b.dataset.tpl) || null;
    einlagernFormular('', { category: kategorie, name: tpl?.name || '' }, tpl,
      () => renderEinlagern(kategorie));
  }));
}

// ------------------------------------------------------------------ Vorlagen
// Dieselben Vorlagen wie in der Verwaltung und am Terminal - hier nur mit
// grossen Flaechen, weil das am Telefon mit dem Daumen bedient wird.
// "🏠 – · ❄️ 2 · 🧊 180" - leer heisst: wie die Kategorie.
function haltKurz(t) {
  const h = t.haltbarkeit && Object.keys(t.haltbarkeit).length
    ? t.haltbarkeit : (t.shelf_days ? { kuehl: t.shelf_days } : {});
  if (!Object.keys(h).length) return 'MHD wie Kategorie';
  return [['raum', '🏠'], ['kuehl', '❄️'], ['tiefkuehl', '🧊']]
    .map(([k, i]) => `${i} ${h[k] ? `${h[k]} T` : '–'}`).join(' · ');
}

// Vorlagen nach Kategorie, aufklappbar, mit Suche. Eine Zeile je Vorlage;
// Antippen oeffnet sie zum Aendern (dort steht auch Loeschen).
let tplSuche = '';
let tplOffen = null; // Set der offenen Kategorien; null = noch nicht entschieden

// Nur die gesetzten Haltbarkeiten - "🏠 – · ❄️ 7 T · 🧊 –" war zu lang.
function haltKompakt(t) {
  const h = t.haltbarkeit && Object.keys(t.haltbarkeit).length
    ? t.haltbarkeit : (t.shelf_days ? { kuehl: t.shelf_days } : {});
  return [['raum', '🏠'], ['kuehl', '❄️'], ['tiefkuehl', '🧊']]
    .filter(([k]) => h[k]).map(([k, i]) => `${i} ${h[k]} T`).join(' ');
}

async function renderTemplates() {
  const rows = await get('/api/templates');
  count.textContent = rows.length;
  if (tplOffen === null) {
    // Wenige Vorlagen: alles offen. Viele: nur die Kategorien als Uebersicht.
    tplOffen = new Set(rows.length <= 8 ? rows.map((t) => t.category) : []);
  }
  view.innerHTML = `
    <div class="msearch"><input id="tpl-q" type="search" placeholder="Vorlage suchen: Name, Marke, Sorte"
      value="${esc(tplSuche)}" autocomplete="off" enterkeyhint="search" aria-label="Vorlage suchen"></div>
    <div class="list" id="tpl-list"></div>`;
  let timer;
  document.getElementById('tpl-q').addEventListener('input', (ev) => {
    clearTimeout(timer);
    timer = setTimeout(() => { tplSuche = ev.target.value.trim(); fillTemplates(rows); }, 200);
  });
  fillTemplates(rows);
}

function fillTemplates(rows) {
  const box = document.getElementById('tpl-list');
  if (!box) return;
  const q = tplSuche.toLowerCase();
  const passt = (t) => !q || [t.name, t.category, ...(t.brands || []), ...(t.sorten || [])]
    .some((x) => String(x || '').toLowerCase().includes(q));
  const gefunden = rows.filter(passt);
  const kategorien = new Map();
  for (const t of [...gefunden].sort((x, y) => x.name.localeCompare(y.name, 'de'))) {
    const k = t.category || 'Ohne Kategorie';
    if (!kategorien.has(k)) kategorien.set(k, []);
    kategorien.get(k).push(t);
  }
  const zeile = (t) => {
    const unter = [(t.brands || []).join(', '),
      (t.sorten || []).length ? `${t.sorten.length} ${t.sorten.length === 1 ? 'Sorte' : 'Sorten'}` : '', haltKompakt(t)].filter(Boolean);
    return `<button type="button" class="swipe-inner tpl-zeile" data-edit="${t.id}">
      <div class="kopf"><div class="t">${esc(t.name)}</div>${t.unit ? `<span class="muted">${esc(t.unit)}</span>` : ''}</div>
      ${unter.length ? `<div class="s">${unter.map(esc).join(' · ')}</div>` : ''}</button>`;
  };
  box.innerHTML = `<button class="primary" id="tpl-new">+ Neue Vorlage</button>
    ${[...kategorien.entries()].sort(([a], [b]) => a.localeCompare(b, 'de')).map(([k, liste]) => {
      const offen = !!q || tplOffen.has(k);
      return `<div class="gruppe" data-kat="${esc(k)}">
        <div class="swipe-inner gkopf" role="button" tabindex="0" aria-expanded="${offen}">
          <div class="kopf"><div class="t">${esc(k)}</div><span class="pill anzahl">${liste.length}</span></div>
        </div>
        <div class="gliste"${offen ? '' : ' hidden'}>${liste.map(zeile).join('')}</div>
      </div>`;
    }).join('') || `<div class="empty">${q ? `Keine Vorlage zu „${esc(tplSuche)}“.` : 'Noch keine Vorlage.'}</div>`}`;

  document.getElementById('tpl-new').addEventListener('click', () => templateForm(null));
  box.querySelectorAll('.gkopf').forEach((kopf) => kopf.addEventListener('click', () => {
    const g = kopf.closest('.gruppe'), liste = g.querySelector('.gliste');
    liste.hidden = !liste.hidden;
    kopf.setAttribute('aria-expanded', String(!liste.hidden));
    if (liste.hidden) tplOffen.delete(g.dataset.kat); else tplOffen.add(g.dataset.kat);
  }));
  box.querySelectorAll('[data-edit]').forEach((b) => b.addEventListener('click',
    () => templateForm(rows.find((t) => t.id === +b.dataset.edit))));
}

async function templateForm(tpl) {
  const categories = await get('/api/categories');
  const units = EINHEITEN;
  title.textContent = tpl ? tpl.name : 'Neue Vorlage';
  count.textContent = '';

  const option = (value, selected) => `<option ${value === selected ? 'selected' : ''}>${esc(value)}</option>`;
  // Haltbarkeit je Lagerart. Alte Vorlagen hatten nur "MHD-Tage" - die
  // gelten als Kuehlschrank-Wert, bis man es anders eintraegt.
  const halt = [['raum', '🏠 Vorrat'], ['kuehl', '❄️ Kühlschrank'], ['tiefkuehl', '🧊 Gefrier']];
  const tplHalt = tpl?.haltbarkeit && Object.keys(tpl.haltbarkeit).length
    ? tpl.haltbarkeit : (tpl?.shelf_days ? { kuehl: tpl.shelf_days } : {});
  const katHalt = (name) => categories.find((c) => c.name === name)?.haltbarkeit || {};
  view.innerHTML = `<form class="mform" id="tplform">
    <label class="field"><span>Name</span>
      <input name="name" value="${esc(tpl?.name || '')}" required autocomplete="off"></label>
    <label class="field"><span>Kategorie</span>
      <select name="category">${categories.map((c) => option(c.name, tpl?.category)).join('')}
        ${tpl && !categories.some((c) => c.name === tpl.category) ? option(tpl.category, tpl.category) : ''}
      </select></label>
    <div class="field"><span>Haltbarkeit in Tagen – leer = wie die Kategorie</span>
      <div class="row" style="gap:8px;flex-wrap:nowrap">${halt.map(([k, label]) => `
        <label style="flex:1;font-size:13px;color:var(--muted)">${label}
          <input name="h_${k}" type="number" inputmode="numeric" min="0" style="width:100%"
            value="${tplHalt[k] || ''}" placeholder="${katHalt(tpl?.category)[k] || '–'}"></label>`).join('')}
      </div></div>
    <label class="field"><span>Einheit</span>
      <select name="unit">${units.map((u) => option(u, tpl?.unit || '')).join('')}</select></label>
    <div class="field"><span>Marken</span><div id="f-brands"></div></div>
    <label class="row tight" style="font-size:16px"><input type="checkbox" name="use_sorten"
      ${tpl?.use_sorten ? 'checked' : ''}> Sorte beim Einlagern abfragen (z. B. Fleischsorte)</label>
    <div class="field" id="f-sorten-feld" ${tpl?.use_sorten ? '' : 'hidden'}><span>Sorten zur Auswahl –
      steht danach auf dem Etikett: „${esc(tpl?.name || 'Filet')} - Schwein“</span><div id="f-sorten"></div></div>
    <div class="row">
      <button type="button" class="ghost" id="tpl-cancel" style="flex:1">Abbrechen</button>
      <button class="primary" style="flex:1">Speichern</button>
    </div>
    ${tpl ? '<button type="button" class="danger" id="tpl-del">Vorlage löschen</button>' : ''}</form>`;

  // Platzhalter zeigen, was die gewaehlte Kategorie vorgibt. Eine neue
  // Vorlage uebernimmt die Werte der Kategorie als eigene (die Kategorie ist
  // nur die Grundempfehlung) - bis man ein Feld selbst aendert.
  const haltFeld = (k) => document.querySelector(`#tplform [name="h_${k}"]`);
  const katUebernehmen = (name) => {
    const h = katHalt(name);
    halt.forEach(([k]) => {
      const f = haltFeld(k);
      f.placeholder = h[k] || '–';
      if (!tpl && !f.dataset.vonHand) f.value = h[k] || '';
    });
  };
  halt.forEach(([k]) => haltFeld(k).addEventListener('input', (ev) => { ev.target.dataset.vonHand = '1'; }));
  document.querySelector('#tplform [name="category"]').addEventListener('change', (ev) => katUebernehmen(ev.target.value));
  katUebernehmen(document.querySelector('#tplform [name="category"]').value);
  const brands = tagEditor(document.getElementById('f-brands'), tpl?.brands || [], 'Marke hinzufügen …');
  const sorten = tagEditor(document.getElementById('f-sorten'), tpl?.sorten || [], 'Sorte hinzufügen …');
  // Haken gesetzt: Sortenliste zeigen und, wenn leer, mit denen der
  // Kategorie fuellen (Fleisch: Schwein, Geflügel, Rind, …).
  const sortenFeld = document.getElementById('f-sorten-feld');
  const sortenHaken = document.querySelector('#tplform [name="use_sorten"]');
  sortenHaken.addEventListener('change', () => {
    sortenFeld.hidden = !sortenHaken.checked;
    const kat = categories.find((c) => c.name === document.querySelector('#tplform [name="category"]').value);
    if (sortenHaken.checked && sorten.isEmpty() && kat?.subcategories?.length) sorten.set(kat.subcategories);
  });

  document.getElementById('tpl-del')?.addEventListener('click', async () => {
    if (!confirm(`Vorlage „${tpl.name}“ wirklich löschen?`)) return;
    try {
      await del(`/api/templates/${tpl.id}`);
      toast('Gelöscht');
      title.textContent = TITLES.tpl;
      renderTemplates();
    } catch (e) { toast(e.message, 'error'); }
  });

  document.getElementById('tpl-cancel').addEventListener('click', () => {
    title.textContent = TITLES.tpl;
    renderTemplates();
  });

  document.getElementById('tplform').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const form = new FormData(ev.target);
    const body = {
      name: form.get('name').trim(),
      category: form.get('category'),
      haltbarkeit: Object.fromEntries(halt.map(([k]) => [k, parseInt(form.get(`h_${k}`), 10) || 0])),
      unit: form.get('unit'),
      brands: brands.values(),
      sorten: sorten.values(),
      use_sorten: form.get('use_sorten') === 'on',
      sort_order: tpl?.sort_order ?? 0,
    };
    try {
      if (tpl) await put(`/api/templates/${tpl.id}`, body);
      else await post('/api/templates', body);
      toast('Gespeichert', 'success');
      title.textContent = TITLES.tpl;
      renderTemplates();
    } catch (e) { toast(e.message, 'error'); }
  });
}

liveConnect((msg) => {
  // Bei der Liste nur die Eintraege auffrischen - ein kompletter Neuaufbau
  // naehme dem Suchfeld mitten im Tippen den Fokus.
  if (msg.event === 'inventory' && (current === 'inv' || current === 'exp')) fillList().catch(() => {});
}, () => {});

render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
</script>
