; Schlanke Terminal-Firmware fuer das Waveshare ESP32-S3-Touch-LCD-3.5.
;
; Gegenueber dem Vorgaengerprojekt entfallen: Webserver, JSON-Dateisystem,
; MySQL-Client, MQTT, Telegram, OpenFoodFacts und der komplette
; Inventar-Zustandsautomat. Uebrig bleiben BLE-Scanner, Anzeige, Touch,
; Drucker und eine WebSocket-Verbindung zum Server.
;
; Folge: eine Firmware-Partition genuegt fuer OTA mit reichlich Reserve, und es
; gibt kein LittleFS-Abbild mehr, das getrennt geflasht werden muss.

[platformio]
default_envs = terminal

[env:terminal]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder, time

board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions_ota.csv

lib_deps =
    bblanchon/ArduinoJson @ ^7.4.3
    links2004/WebSockets @ ^2.6.1
    bodmer/TFT_eSPI @ ^2.5.43
    h2zero/NimBLE-Arduino @ ^2.1.0
    ricmoo/QRCode @ ^0.0.1

build_flags =
    -Iinclude
    -Isrc
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM=1
    -DUSER_SETUP_LOADED=1
    ; Der Standard-FSPI-Pfad des ESP32-S3 dereferenziert eine ungueltige
    ; SPI-Registerbasis und endet in einem Panic mit EXCVADDR=0x10.
    ; HSPI erzwingen - das ist keine Optimierung, sondern Pflicht.
    -DUSE_HSPI_PORT=1
    -DST7796_DRIVER=1
    -DTFT_WIDTH=320
    -DTFT_HEIGHT=480
    -DTFT_MOSI=1
    -DTFT_MISO=2
    -DTFT_SCLK=5
    -DTFT_CS=-1
    -DTFT_DC=3
    -DTFT_RST=-1
    -DTFT_BL=6
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_GFXFF=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=16000000
    ; PSRAM fuer den Sprite freigeben (spart rund 300 KB internen Heap).
    -DCONFIG_SPIRAM_SUPPORT=1
    ; ACHTUNG: Task-Stacks duerfen trotzdem NICHT in PSRAM liegen. PSRAM haengt
    ; am selben Cache-Controller wie der Flash; waehrend eines NVS-Schreibvorgangs
    ; ist der Cache abgeschaltet und der Stack unerreichbar
    ; -> assert esp_task_stack_is_sane_cache_disabled().
    -DCORE_DEBUG_LEVEL=2
    -O2

extra_scripts = pre:scripts/version.py
