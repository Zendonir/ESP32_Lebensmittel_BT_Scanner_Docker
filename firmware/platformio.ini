; Zwei Waveshare-Boards, eine Anwendungslogik. Die Displays sind elektrisch
; inkompatibel und werden deshalb als getrennte Firmware-Abbilder gebaut.

[platformio]
default_envs = terminal-35, terminal-35b

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder, time
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions_ota.csv
lib_deps =
    bblanchon/ArduinoJson @ ^7.4.3
    links2004/WebSockets @ ^2.6.1
    h2zero/NimBLE-Arduino @ ^2.1.0
    ricmoo/QRCode @ ^0.0.1
build_flags =
    -Iinclude
    -Isrc
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM=1
    -DCORE_DEBUG_LEVEL=2
    -O2
extra_scripts = pre:scripts/version.py

[env:terminal-35]
lib_deps =
    ${env.lib_deps}
    bodmer/TFT_eSPI @ ^2.5.43
build_flags =
    ${env.build_flags}
    -DBOARD_WAVESHARE_35=1
    -DUSER_SETUP_LOADED=1
    -DUSE_HSPI_PORT=1
    -DST7796_DRIVER=1
    -DTFT_WIDTH=320
    -DTFT_HEIGHT=480
    -DTFT_MOSI=1
    -DTFT_MISO=2
    -DTFT_SCLK=5
    -DTFT_CS=-1
    -DTFT_DC=3
    -DTFT_RST=-1
    -DTFT_BL=6
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_GFXFF=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=16000000
    -DCONFIG_SPIRAM_SUPPORT=1

[env:terminal-35b]
lib_deps =
    ${env.lib_deps}
    moononournation/GFX Library for Arduino @ ^1.6.0
build_flags =
    ${env.build_flags}
    -DBOARD_WAVESHARE_35B=1
