name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Bei mehreren Pushes kurz hintereinander zaehlt nur der letzte Stand. Ohne das
# laufen drei Firmware-Builds gleichzeitig, die alle dasselbe pruefen - und
# jeder davon zieht die Toolchain neu.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (Tests, Linter, Image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements-dev.txt

      - name: Abhaengigkeiten
        run: pip install -r server/requirements-dev.txt

      - name: Linter
        run: ruff check server/app server/tests

      - name: Tests
        working-directory: server
        env:
          DEVICE_TOKEN: ci-token
        run: python -m pytest tests -q

      - name: Docker-Image bauen
        run: docker build -t lebensmittel-scanner:ci ./server

      - name: Container startet und antwortet
        run: |
          docker run -d --name ci -p 8080:8080 -e DEVICE_TOKEN=ci-token \
            -e DATABASE_URL=sqlite+aiosqlite:////tmp/ci.db lebensmittel-scanner:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/api/health && break || sleep 2
          done
          curl -fsS http://localhost:8080/api/health
          curl -fsS -o /dev/null http://localhost:8080/
          docker rm -f ci

  firmware:
    name: Firmware (Build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: PlatformIO
        run: pip install platformio

      # Wiederherstellen und Sichern getrennt: mit dem kombinierten Schritt
      # laeuft "Post Run cache" bei einem fehlgeschlagenen Job gar nicht erst.
      # Dann wird nach einem Fehlschlag nichts gesichert, der naechste Lauf
      # faengt wieder bei null an und haengt wieder am Netz - ein Kreis, aus
      # dem der Job von allein nicht mehr herausfindet.
      - name: Toolchain aus dem Zwischenspeicher
        id: pio-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
            ~/.platformio/penv
          key: pio-${{ hashFiles('firmware/platformio.ini') }}

      # Die Toolchain vorab holen, mit Wiederholung. Sie richtet sich eine
      # eigene Python-Umgebung ein und laedt sich dafuer Pakete nach; haengt
      # PyPI oder der Spiegel gerade, bricht das mit "Failed to install Python
      # dependencies into penv" ab. Das passiert mitten im Bauen und sieht dann
      # aus wie ein Fehler am Code - ist aber keiner. Als eigener Schritt ist
      # es beim naechsten Mal sofort als das erkennbar, was es ist.
      - name: Toolchain bereitstellen
        working-directory: firmware
        run: |
          for versuch in 1 2 3; do
            if pio pkg install; then exit 0; fi
            echo "Versuch $versuch fehlgeschlagen, neuer Anlauf in $((versuch * 15)) s"
            sleep $((versuch * 15))
          done
          echo "Toolchain liess sich nach drei Anlaeufen nicht einrichten" >&2
          exit 1

      # Ab hier ohne Netz, und das ist der Kern der Sache.
      #
      # Die Plattform prueft ihre Python-Umgebung bei *jeder* Umgebung neu
      # (builder/penv_setup.py). Dabei steht der Kern in ihrer Liste unter
      # "platformio", installiert wird er aber als "pioarduino-core" - die
      # Namen treffen sich nie. Die Pruefung kommt also immer zu dem Schluss,
      # das Paket fehle, und laedt das Zip von GitHub erneut. Bei zwei
      # Umgebungen sind das drei Ladevorgaenge desselben Archivs in vier
      # Minuten; einer davon geht irgendwann daneben, und der Lauf bricht mit
      # "Failed to install Python dependencies into penv" ab - mitten im
      # Bauen, nachdem die erste Firmware schon fertig war.
      #
      # Genau so ist es nach dem Merge passiert: terminal-35 fertig, 113 s,
      # dann terminal-35b tot nach 23 s. Am Code lag es nicht, der Baum auf
      # main war Zeichen fuer Zeichen derselbe wie auf dem Zweig.
      #
      # PLATFORMIO_OFFLINE=1 laesst die Pruefung aus. Alles, was gebraucht
      # wird, hat der Schritt davor geholt - der darf und soll ans Netz.
      # Damit ist der Bauschritt von der Netzlage unabhaengig, und ein Fehler
      # dort ist wieder das, wonach er aussieht: ein Fehler am Code.
      #
      # Deshalb steht hier auch *keine* Wiederholung. Eine Wiederholung um
      # einen Uebersetzungsfehler herum verdeckt ihn nur dreimal.
      - name: Bauen
        working-directory: firmware
        env:
          PLATFORMIO_OFFLINE: "1"
        run: pio run

      - name: Groesse der Firmware
        working-directory: firmware
        env:
          PLATFORMIO_OFFLINE: "1"
        run: pio run --target size | tail -25

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            firmware/.pio/build/terminal-35/firmware.bin
            firmware/.pio/build/terminal-35b/firmware.bin
          if-no-files-found: error

      # Auch nach einem Fehlschlag sichern, sonst siehe oben.
      - name: Toolchain in den Zwischenspeicher
        if: always() && steps.pio-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
            ~/.platformio/penv
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
