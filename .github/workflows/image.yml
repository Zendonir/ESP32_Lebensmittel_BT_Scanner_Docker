name: Image veroeffentlichen

# TrueNAS kann keine Images bauen - eine Custom App zieht immer aus einer
# Registry. Dieser Workflow legt das Image nach GHCR, damit die YAML unter
# deploy/truenas/ etwas zum Ziehen hat.

on:
  push:
    branches:
      - main
      - "claude/**"       # jeder Arbeitszweig bekommt ein Abbild zum Ausprobieren
    tags: ["v*"]
  workflow_dispatch:
  # Aufgerufen von release.yml mit der frisch vergebenen Nummer. Der Tag, den
  # release.yml setzt, loest diesen Ablauf nicht selbst aus (GITHUB_TOKEN) -
  # deshalb kommt Nummer und Stand hier als Eingabe herein.
  workflow_call:
    inputs:
      version:
        description: "Release-Tag, z. B. v1.0.3"
        type: string
        required: true
      ref:
        description: "Commit, aus dem gebaut wird"
        type: string
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || '' }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: An GHCR anmelden
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Kennzeichnung ableiten
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # "latest" folgt den *Releases*, nicht dem letzten Commit auf main.
          #
          # Vorher zeigte es auf den jeweils neuesten main-Stand - also auf
          # einen Entwicklungsstand, den niemand geprueft hat. Wer
          # ":latest" einsetzt, meint aber "die neueste fertige Fassung",
          # und genau die soll er bekommen. Der Kopf von main bleibt als
          # ":main" erreichbar, fuer alle, die ihn wirklich wollen.
          #
          # Aus release.yml kommt die Nummer als Eingabe; ein von Hand
          # geschobener Tag bringt sie in github.ref mit. Beides ergibt
          # dieselben Kennzeichen.
          tags: |
            type=ref,event=branch,enable=${{ inputs.version == '' }}
            type=semver,pattern={{version}},value=${{ inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }}
            type=semver,pattern={{major}},value=${{ inputs.version }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' || inputs.version != '' }}

      - name: Bauen und schieben
        uses: docker/build-push-action@v6
        with:
          context: ./server
          # TrueNAS SCALE laeuft auf amd64; arm64 kommt mit, damit dasselbe
          # Image auch auf einem Raspberry Pi oder einer ARM-VM laeuft.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ inputs.version || github.ref_name }}
            APP_COMMIT=${{ inputs.ref || github.sha }}
            APP_BUILT=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
