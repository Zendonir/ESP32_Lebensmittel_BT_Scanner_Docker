name: Image veroeffentlichen

# TrueNAS kann keine Images bauen - eine Custom App zieht immer aus einer
# Registry. Dieser Workflow legt das Image nach GHCR, damit die YAML unter
# deploy/truenas/ etwas zum Ziehen hat.

on:
  push:
    branches: ["main", "claude/lebensmittelscanner-redesign-vto9sg"]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: An GHCR anmelden
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Kennzeichnung ableiten
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Bauen und schieben
        uses: docker/build-push-action@v6
        with:
          context: ./server
          # TrueNAS SCALE laeuft auf amd64; arm64 kommt mit, damit dasselbe
          # Image auch auf einem Raspberry Pi oder einer ARM-VM laeuft.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
