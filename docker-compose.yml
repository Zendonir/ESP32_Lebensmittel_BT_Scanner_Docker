services:
  lebensmittel:
    build:
      context: ./server
      args:
        APP_VERSION: "2.0"
    image: lebensmittel-scanner:2.0
    container_name: lebensmittel-scanner
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - scanner-data:/data
    env_file:
      - .env
    environment:
      # SQLite reicht fuer einen Haushalt vollkommen. Fuer Postgres den
      # postgres-Dienst unten aktivieren und DATABASE_URL umstellen.
      DATABASE_URL: sqlite+aiosqlite:////data/lebensmittel.db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Optional - erst einschalten, wenn mehrere Haushalte/Terminals im Spiel sind.
  # postgres:
  #   image: postgres:16-alpine
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_DB: lebensmittel
  #     POSTGRES_USER: scanner
  #     POSTGRES_PASSWORD: bitte-aendern
  #   volumes:
  #     - pg-data:/var/lib/postgresql/data

volumes:
  scanner-data:
  # pg-data:
